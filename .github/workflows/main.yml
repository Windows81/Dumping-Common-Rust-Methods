name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false # Allows jobs to fail independently.
      matrix:
        dependency-to-test:
          - reqwest

        build-env:
          - os: windows-latest
            arch: i686-pc-windows-gnu
          - os: windows-latest
            arch: i686-pc-windows-gnullvm
          - os: windows-latest
            arch: i686-pc-windows-msvc
          - os: windows-latest
            arch: i686-uwp-windows-gnu
          - os: windows-latest
            arch: i686-uwp-windows-msvc
          - os: windows-latest
            arch: i686-win7-windows-msvc
          - os: windows-latest
            arch: x86_64-pc-windows-gnu
          - os: windows-latest
            arch: x86_64-pc-windows-gnullvm
          - os: windows-latest
            arch: x86_64-pc-windows-msvc
          - os: windows-latest
            arch: x86_64-uwp-windows-gnu
          - os: windows-latest
            arch: x86_64-uwp-windows-msvc
          - os: windows-latest
            arch: x86_64-win7-windows-gnu

          - os: ubuntu-latest
            arch: i686-unknown-linux-gnu
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnuasan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnumsan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnutsan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnux32


    runs-on: ${{ matrix.build-env.os }}

    steps:
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Check Out
      uses: actions/checkout@v4

    - name: Build
      run: python action.py "${{ matrix.build-env.arch }}" "${{ matrix.dependency-to-test }}"

    - name: Add and Commit
      uses: EndBug/add-and-commit@v9
      with:
        add: results
        message: 'Update latest signatures'
