name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false # Allows jobs to fail independently.
      matrix:
        dependency-to-test:
          - name: reqwest
            min-version: 0.11.0
            max-version: 9007199254740991.9007199254740991.9007199254740991
          - name: hyper
            min-version: 0.3.15
            max-version: 9007199254740991.9007199254740991.9007199254740991
          - name: http
            min-version: 0.1.19
            max-version: 9007199254740991.9007199254740991.9007199254740991

        build-env:
          - os: windows-latest
            arch: i686-pc-windows-gnu
          - os: windows-latest
            arch: i686-pc-windows-gnullvm
          - os: windows-latest
            arch: i686-pc-windows-msvc
          - os: windows-latest
            arch: x86_64-pc-windows-gnu
          - os: windows-latest
            arch: x86_64-pc-windows-msvc

          - os: ubuntu-latest
            arch: i686-unknown-linux-gnu
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnuasan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnumsan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnutsan
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnux32


    runs-on: ${{ matrix.build-env.os }}

    steps:
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup
        key: ${{ runner.os }}-cargo

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set Up Rustup
      run: rustup target add "${{ matrix.build-env.arch }}"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Build
      run: python action.py \
        "${{ matrix.build-env.arch }}" "${{ matrix.dependency-to-test.name }}" \
        "${{ matrix.dependency-to-test.min-version }}" "${{ matrix.dependency-to-test.max-version }}"

    - name: Add and Commit
      uses: EndBug/add-and-commit@v10
      with:
        add: results
        pull: '--rebase --autostash'
        push_attempts: 3
